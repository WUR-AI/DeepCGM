[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcgm-generic"
version = "1.0.0"
description = "Pretrained deep learning crop growth model adaptable to new wheat cultivars"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE.md" }   # CC BY-NC 4.0; see LICENSE for the data carve-out
authors = [
    { name = "Jingye Han", email = "jingye.han@wur.nl" },
    { name = "Ioannis N. Athanasiadis" },
]
keywords = ["crop model", "deep learning", "LoRA", "hypernetwork", "wheat", "DeepCGM"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "torch>=1.13",
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/WUR-AI/DeepCGM/tree/DeepCGM-generic"

[tool.setuptools]
packages = ["deepcgm", "deepcgm.models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
